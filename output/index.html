<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tannerhill Dashboard</title>
<link rel="icon" href="data:,">
<style>
  /* Layout and styling from sources/dashboard-redesign-reference-v2.html */
  :root { --ink:#1F3044; --mut:#64748B; --bd:#E4E9F2; --bg:#F8F8FF; --green:#10B981; --amber:#F59E0B; --red:#E11D48; --grey:#94A3B8; --navy:#1F3044; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--navy); color: #fff; padding: 18px 28px; }
  header h1 { margin: 0; font: 700 22px/1.2 system-ui, sans-serif; } header .sub { font-size: 13px; color: #A9B8CC; margin-top: 4px; }
  .shell { display: flex; min-height: calc(100vh - 90px); }
  nav { width: 200px; background: #fff; border-right: 1px solid var(--bd); padding: 18px 0; flex-shrink: 0; }
  nav button { display: block; width: 100%; text-align: left; padding: 11px 22px; border: none; background: none; font: 600 13px/1.3 system-ui, sans-serif; color: var(--mut); cursor: pointer; border-left: 3px solid transparent; }
  nav button.active { color: var(--navy); border-left-color: var(--navy); background: #F8FAFF; }
  nav button:focus-visible, .subnav button:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
  main { flex: 1; padding: 26px 30px; overflow-x: auto; min-width: 0; }
  .tabpanel { display: none; } .tabpanel.active { display: block; }
  .row { display: grid; gap: 14px; margin-bottom: 16px; }
  .r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; } .r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .r4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .r4, .r2 { grid-template-columns: minmax(0, 1fr); } }
  .kpi-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .stat-card { border-radius: 12px; padding: 16px 18px; color: #fff; position: relative; overflow: hidden; min-height: 110px; }
  .stat-card .s-icon { position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; opacity: .85; }
  .stat-card .s-lbl { font: 700 11px/1.2 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; opacity: .9; }
  .stat-card .s-val { font: 700 22px/1.2 system-ui, sans-serif; margin: 8px 0 2px; }
  .stat-card .s-sub { font-size: 11px; opacity: .85; margin-bottom: 3px; }
  .stat-card .s-cap { font-size: 10.5px; opacity: .9; margin-top: 3px; }
  .c-revenue { background: linear-gradient(135deg, #4F46E5, #3730A3); } .c-inventory { background: linear-gradient(135deg, #0891B2, #155E75); }
  .c-marketing { background: linear-gradient(135deg, #7C3AED, #5B21B6); } .c-cash { background: linear-gradient(135deg, #64748B, #334155); }
  .band-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 700 10px/1.4 system-ui, sans-serif; margin-top: 2px; }
  .band-pill.red { background: #fff; color: var(--red); } .band-pill.amber { background: #fff; color: #92400E; }
  .band-pill.green { background: #fff; color: #047857; } .band-pill.grey { background: rgba(255,255,255,.25); color: #fff; }
  .band-pill.stale { background: rgba(255,255,255,.25); color: #fff; border: 1px dashed rgba(255,255,255,.7); }
  /* Band pills outside the coloured stat cards */
  .light .band-pill.red { background: #FFE4E6; } .light .band-pill.amber { background: #FFFBEB; } .light .band-pill.green { background: #ECFDF5; }
  .stale-chip { background: var(--amber); color: var(--ink); padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .sub-card { background: #fff; border: 1px solid var(--bd); border-radius: 10px; padding: 12px 14px; }
  .sub-card .sc-title { font: 700 10.5px/1.3 system-ui, sans-serif; color: var(--mut); text-transform: uppercase; margin-bottom: 8px; }
  .compare-bars { display: flex; gap: 16px; align-items: flex-end; height: 90px; margin: 8px 0; justify-content: center; }
  .cbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 92px; }
  .cbar .bv { font-size: 11px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; color: var(--mut); }
  .cbar.hi .bv { font-size: 14px; font-weight: 800; color: var(--ink); }
  .cbar .bf { width: 42px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .cbar .bl { font-size: 9.5px; color: var(--mut); margin-top: 4px; }
  .mini-count-row { display: flex; gap: 8px; }
  .mini-count { flex: 1; background: #F8FAFF; border-radius: 8px; padding: 8px; text-align: center; }
  .mini-count .mcv { font: 700 16px/1.2 system-ui, sans-serif; } .mini-count .mcl { font-size: 9px; color: var(--mut); text-transform: uppercase; }
  .legend-box { display: flex; gap: 22px; flex-wrap: wrap; background: #fff; border: 1px solid var(--bd); border-radius: 10px; padding: 12px 18px; margin-bottom: 18px; font-size: 12px; }
  .legend-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .legend-group .gtitle { font-weight: 700; color: var(--mut); text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; margin-right: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  h2.section { font: 700 13px/1.2 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); margin: 0 0 12px; }
  h3.group-head { font: 700 15px/1.2 system-ui, sans-serif; color: var(--navy); margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--navy); }
  h3.group-head:first-child { margin-top: 0; }
  .subnav { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 2px solid var(--bd); overflow-x: auto; }
  .subnav button { padding: 9px 16px; border: none; background: none; font: 700 12.5px/1.3 system-ui, sans-serif; color: var(--mut); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
  .subnav button.active { color: var(--navy); border-bottom-color: var(--navy); }
  .subpanel { display: none; } .subpanel.active { display: block; }
  .chart-card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
  .chan-card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 14px; min-width: 0; }
  .chan-top { display: flex; align-items: flex-start; gap: 10px; }
  .chan-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chan-name { font: 700 10.5px/1.3 system-ui, sans-serif; color: var(--mut); text-transform: uppercase; }
  .chan-val { font: 700 18px/1.2 system-ui, sans-serif; } .chan-cap { font-size: 10px; color: var(--mut); }
  .linechart { position: relative; margin: 14px 0; }
  .linechart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .line-key { font-size: 10.5px; margin-top: 4px; color: var(--mut); }
  .table-wrap { overflow-x: auto; }
  table.dtbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.dtbl th { text-align: left; color: var(--mut); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 7px 8px; border-bottom: 2px solid var(--bd); }
  table.dtbl td { padding: 8px 8px; border-bottom: 1px solid var(--bd); }
  table.dtbl td.num, table.dtbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { background: #F1F5F9; border-radius: 4px; height: 16px; position: relative; overflow: hidden; width: 100px; display: inline-block; vertical-align: middle; }
  .track .fill2 { height: 100%; border-radius: 4px; }
  .matrix-status { font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
  .matrix-status.confirmed { background: #ECFDF5; color: #047857; }
  .matrix-status.pending { background: #FFFBEB; color: #92400E; }
  .matrix-status.decided { background: #EEF2FF; color: #3730A3; }
  .grpname td { font-weight: 700; color: var(--navy); font-size: 11.5px; text-transform: uppercase; padding: 14px 8px 6px; background: #F8FAFF; }
  .unknown { color: var(--grey); font-style: italic; }
  .flag-box { background: #FFF7ED; border: 1px solid #FDBA74; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #9A3412; margin-top: 10px; }
  .summary-widget { background: #F8FAFF; border: 1px solid var(--bd); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .lbl { font: 700 10.5px/1.3 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); }
  .val { font: 700 22px/1.15 system-ui, sans-serif; margin: 6px 0 3px; }
  .det { font-size: 12.5px; color: var(--mut); }
  .star { color: #F59E0B; font-weight: 800; margin-left: 4px; }
  .na { color: var(--grey); }
  .open-note { font-size: 10.5px; color: #92400E; margin-top: 4px; }
  .data-asof { font-size: 12px; color: var(--mut); margin: 0 0 8px; }
  .data-asof.small { font-size: 11px; color: inherit; opacity: .85; margin: 6px 0 0; }
  .profit-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 90px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .profit-row .track { width: 100%; }
  .profit-row .pv { text-align: right; font-weight: 700; white-space: nowrap; }
  @media (max-width: 600px) { .profit-row { grid-template-columns: minmax(0, 1fr) 84px; } .profit-row .track { grid-column: 1 / -1; order: 3; } }
  tr.flag-row td { background: #FFF7ED; }
  tr.flag-note td { background: #FFF7ED; color: #9A3412; font-size: 12px; padding-top: 0; }

  /* Owner, sourcing and calculation lines (PR #9) */
  .owner-line { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--bd); font-size: 11.5px; color: var(--mut); }
  .owner-line b { color: var(--ink); font-weight: 600; }
  .stat-card .owner-line { color: rgba(255,255,255,.85); border-top-color: rgba(255,255,255,.35); margin-top: 10px; padding-top: 6px; }
  .stat-card .owner-line b { color: #fff; }
  .owner-line + .owner-line { margin-top: 2px; padding-top: 0; border-top: none; }
  .owner-line + .owner-line.section-owner { margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,.35); }
  .section-owner-head { margin: -8px 0 16px; font-size: 12px; color: var(--mut); }
  .section-owner-head b { color: var(--ink); font-weight: 600; }

  /* Tooltip */
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--navy); color: #fff; font-size: 12px; line-height: 1.4;
         padding: 7px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 12px rgba(0,0,0,.18); white-space: pre-line; }
  [data-tip]:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--bd); font-size: 12.5px; color: var(--mut); }
  footer .pending { color: #92400E; font-weight: 600; }
  .card { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .card h2 { margin: 0; font-size: 16px; }
  .card .note { font-size: 12.5px; color: var(--mut); }
  .pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.red { background: #FFE4E6; color: #9F1239; }
  #load-error code { background: #F1F5F9; padding: 1px 5px; border-radius: 4px; }

  /* Phones: the sidebar becomes a scrollable tab row above the panels. */
  @media (max-width: 700px) {
    .shell { flex-direction: column; }
    nav { width: auto; display: flex; overflow-x: auto; padding: 0; border-right: none; border-bottom: 1px solid var(--bd); }
    nav button { width: auto; white-space: nowrap; padding: 12px 14px; border-left: none; border-bottom: 3px solid transparent; }
    nav button.active { border-bottom-color: var(--navy); }
    main { padding: 18px 16px; }
    header { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Tannerhill Co. — Owner Dashboard</h1>
  <div class="sub">Source: Supabase</div>
</header>

<div class="shell">
  <nav role="tablist" aria-label="Dashboard sections">
    <button class="tab-btn active" role="tab" id="tab-summary" aria-controls="summary" aria-selected="true" data-tab="summary">Executive Summary</button>
    <button class="tab-btn" role="tab" id="tab-details" aria-controls="details" aria-selected="false" tabindex="-1" data-tab="details">Details</button>
    <button class="tab-btn" role="tab" id="tab-notes" aria-controls="notes" aria-selected="false" tabindex="-1" data-tab="notes">Data Notes</button>
    <button class="tab-btn" role="tab" id="tab-rows" aria-controls="rows" aria-selected="false" tabindex="-1" data-tab="rows">Rows read from Supabase</button>
  </nav>

  <main id="app">
    <div class="tabpanel active" id="summary" role="tabpanel" aria-labelledby="tab-summary">
      <section class="card" id="load-status"><p class="note">Loading data…</p></section>
    </div>
    <div class="tabpanel" id="details" role="tabpanel" aria-labelledby="tab-details"></div>
    <div class="tabpanel" id="notes" role="tabpanel" aria-labelledby="tab-notes"></div>
    <div class="tabpanel" id="rows" role="tabpanel" aria-labelledby="tab-rows"></div>
    <footer id="run-footer" hidden></footer>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";

  // ---------- Tables, grouped by the KPI column each one feeds ----------
  var TABLE_GROUPS = [
    { kpi: "Revenue", tables: [
      ["d10_02_revenue_by_month", "All Revenue widgets, both tabs; denominator of ad spend %"] ] },
    { kpi: "Inventory", tables: [
      ["d10_07_3pl_daily_stock", "On hand, on the way, reorder status (latest snapshot)"],
      ["d10_06a_sales_history_amazon_units_ordered", "Daily sell-through rate (Amazon units ordered)"],
      ["d10_06b_sales_history_amazon_units_refunded", "Daily sell-through rate (Amazon units refunded)"],
      ["d10_06c_sales_history_shopify_net_quantity", "Daily sell-through rate (Shopify net quantity)"],
      ["d10_sku_crosswalk", "Joins D10-07 item codes to the D10-06 sales columns"],
      ["d10_05_shopify_sales_by_product_weekly", "Product names (Shopify title for each SKU)"] ] },
    { kpi: "Marketing & Ads", tables: [
      ["d10_08_bidworks_monthly_report", "Ad spend, both periods"],
      ["dashboard_profit_after_ads_products", "Profit after ads (FY2025)"] ] },
    { kpi: "Cash", tables: [
      ["dashboard_cash_in_bank", "Confirms no cash data exists"],
      ["d10_09_bidworks_invoices", "Known upcoming outflows"] ] },
    { kpi: "Not used in any figure (loaded and counted only)", tables: [
      ["dashboard_data_notes", "Earlier data notes; superseded by this tab's notes"],
      ["dashboard_revenue_vs_last_year", "Superseded by the D10-02 revenue metric"],
      ["dashboard_weeks_of_stock_cover", "Superseded by the D10-07 inventory metric"],
      ["dashboard_weeks_of_stock_cover_products", "Superseded by the D10-07 inventory metric"],
      ["dashboard_profit_after_ads", "Header row for the profit table"],
      ["d10_01_order_ledger", "—"],
      ["d10_03_amazon_business_report", "—"],
      ["d10_04_amazon_refunds_by_order_date", "—"] ] }
  ];
  var ALL_TABLES = [];
  TABLE_GROUPS.forEach(function (g) { g.tables.forEach(function (t) { ALL_TABLES.push(t[0]); }); });
  var PAGE_SIZE = 1000;   // Supabase returns at most 1,000 rows per request
  var app = document.getElementById("app");

  // ---------- Formatting ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) {
    var sign = n < 0 ? "−" : "";
    return sign + "$" + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function money2(n) {
    return (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function num(n, d) {
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pill(color, text) { return '<span class="pill ' + color + '">' + esc(text) + "</span>"; }
  function monthName(ym) {
    var p = /^(\d{4})-(\d{2})$/.exec(ym || "");
    if (!p) return ym || "";
    return new Date(Date.UTC(+p[1], +p[2] - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  }
  function shortMonth(ym) {
    var p = /^(\d{4})-(\d{2})$/.exec(ym || "");
    if (!p) return ym || "";
    return new Date(Date.UTC(+p[1], +p[2] - 1, 1)).toLocaleString("en-US", { month: "short", year: "numeric", timeZone: "UTC" });
  }
  function dayLabel(d) {   // Date -> "Apr 1, 2026" (local)
    return MONTHS_SHORT[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function isoDate(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function parseDay(s) {   // "2026-04-01" or "2026-04-01T06:00:00" -> local Date at midnight
    var p = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    return p ? new Date(+p[1], +p[2] - 1, +p[3]) : null;
  }
  function signedPct(x) { return (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1) + "%"; }
  function tipAttr(lines) { return ' data-tip="' + esc(lines.join("\n")) + '" tabindex="0"'; }
  function numOrNull(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function tableRows(results, name) {
    var t = results[name];
    if (!t) return { error: name + " was not read" };
    if (!t.ok) return { error: name + " did not load: " + t.error };
    if (!t.rows.length) return { error: name + " has no rows" };
    return { rows: t.rows };
  }
  function firstError() {
    for (var i = 0; i < arguments.length; i++) if (arguments[i] && arguments[i].error) return arguments[i].error;
    return null;
  }

  // ---------- Owner, review date, sourcing (PR #9) ----------
  // Owner by function/column, per Lena's Day 9 email: Marco on stock, Priya on ads, Lena on revenue and cash.
  var METRIC_OWNERS = { revenue: "Lena", cash: "Lena", stock: "Marco", profit: "Priya", marketing: "Priya" };
  var WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  // First Monday of the month after `now` (local time), so the date moves on by itself each month.
  function nextReviewDate(now) {
    var d = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    while (d.getDay() !== 1) d.setDate(d.getDate() + 1);
    return d;
  }
  // Ownership is per column/section, so it is shown once per section, not on every card:
  // on the section's stat card (Executive Summary) and at the top of its sub-tab (Details).
  function sectionOwnerText(metric) {
    var d = nextReviewDate(lastLoaded || new Date());
    var text = WEEKDAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS_SHORT[d.getMonth()] + " " + d.getFullYear();
    return "Owner, all metrics in this section: <b>" + esc(METRIC_OWNERS[metric]) + '</b> · Review by: <time datetime="' + isoDate(d) + '">' + text + "</time>";
  }
  function sectionOwnerLine(metric) { return '<div class="owner-line section-owner">' + sectionOwnerText(metric) + "</div>"; }
  function sectionOwnerHead(metric) { return '<div class="section-owner-head">' + sectionOwnerText(metric) + "</div>"; }
  // Whether the methodology itself is approved: separate from who owns the number.
  function calcLine() { return '<div class="owner-line">Calculation: new, pending sign-off</div>'; }
  // Who pulls and reconciles the D10-02 revenue export (Lena still owns the decision).
  function sourcedLine() { return '<div class="owner-line">Data sourced by: Marisa (QuickBooks)</div>'; }
  // The Grill Pro flag is an open decision needing action now, so it has no recurring review date.
  var REORDER_FLAG_OWNER = "Marco";
  var GRILL_PRO_ITEM = "TNHC-1002";   // Trailhead Grill Pro, per the confirmed SKU crosswalk
  function reorderOwnerText() { return "Owner: <b>" + esc(REORDER_FLAG_OWNER) + "</b> · Quick confirmation needed"; }

  // ---------- Band rules ----------
  // Wording per KPI is listed in Data Notes → "Band wording by KPI".
  var BANDS = {
    revenue: { amberBelow: 0.10,   // Green >= same month last year; Amber up to 10% below; Red more than 10% below
               words: { green: "On track", amber: "Watch", red: "Below target" } },
    inventory: { leadDays: 56,     // 8 weeks: 6wk factory + 2wk buffer (confirmed, Stacey, 13 Oct 2026)
                 watchDays: 14,    // Watch when on hand is within 14 days' sell-through above the reorder point
                 words: { red: "PO Now", amber: "Watch — Next PO Cycle", green: "Healthy Stock" } },
    adSpend: { greenMax: 0.10, amberMax: 0.15,   // PROPOSED, pending sign-off (see Data Notes)
               words: { green: "On track", amber: "Watch", red: "Act now — review spend" } },
    profit: { words: { green: "Profitable", red: "Losing money" } }
  };
  function revenueBand(cur, ly) {
    if (cur == null || ly == null || !(ly > 0)) return null;
    if (cur >= ly) return "green";
    if (cur >= ly * (1 - BANDS.revenue.amberBelow)) return "amber";
    return "red";
  }
  function adSpendBand(pct) {

  var REV_COLS = {

  function sumOf(list, key) {
    if (!list.length || list.some(function (m) { return m[key] === null; })) return null;
    return list.reduce(function (a, m) { return a + m[key]; }, 0);
  }
  function revenueData(results) {
    var t = tableRows(results, "d10_02_revenue_by_month");

    var thisYear = latest ? latest.ym.slice(0, 4) : null, prevYear = thisYear ? String(+thisYear - 1) : null;

  // ---------- Inventory (d10_07 + d10_06a/b/c via d10_sku_crosswalk) ----------
  function inventoryData(results) {
    var st = tableRows(results, "d10_07_3pl_daily_stock"), xw = tableRows(results, "d10_sku_crosswalk"),
        a = tableRows(results, "d10_06a_sales_history_amazon_units_ordered"),
        b = tableRows(results, "d10_06b_sales_history_amazon_units_refunded"),
        c = tableRows(results, "d10_06c_sales_history_shopify_net_quantity");
    var err = firstError(st, xw, a, b, c);
    if (err) return { error: err };
    // Product names: Shopify product title per handle (d10_05); falls back to the 3PL description.
    var titles = {};
    var n5 = tableRows(results, "d10_05_shopify_sales_by_product_weekly");
    if (!n5.error) n5.rows.forEach(function (r) { titles[r["Product variant SKU"]] = r["Product title"]; });
    // History length: first to last day across the three sales-history tables, inclusive.
    var days = [];
    a.rows.forEach(function (r) { days.push(String(r.order_date)); });
    b.rows.forEach(function (r) { days.push(String(r.refund_date)); });
    c.rows.forEach(function (r) { days.push(String(r.Day)); });
    days.sort();
    var first = parseDay(days[0]), last = parseDay(days[days.length - 1]);
    var historyDays = Math.round((last - first) / 86400000) + 1;
    // Latest snapshot in d10_07.
    var stamps = st.rows.map(function (r) { return String(r.snapshot_ts); }).sort();
    var latestTs = stamps[stamps.length - 1], firstTs = stamps[0];
    var snap = {};
    st.rows.forEach(function (r) { if (String(r.snapshot_ts) === latestTs) snap[r.item_code] = r; });
    function colSum(rows, col) {
      return rows.reduce(function (s, r) {
        var v = numOrNull(r[col]);
        if (v === null) throw new Error("Missing value in column " + col);
        return s + v;
      }, 0);
    }
    var items = [], problems = [];
    xw.rows.forEach(function (x) {
      var s = snap[x.item_code];
      if (!s) { problems.push(x.item_code + " is not in the " + latestTs.slice(0, 10) + " snapshot"); return; }
      if (!(x.amazon_column in a.rows[0]) || !(x.amazon_column in b.rows[0]) || !(x.shopify_column in c.rows[0])) {
        problems.push(x.item_code + ": crosswalk column not found in the sales history"); return;
      }
      var units = colSum(a.rows, x.amazon_column) - colSum(b.rows, x.amazon_column) + colSum(c.rows, x.shopify_column);
      var rate = units / historyDays;
      var rp = rate * BANDS.inventory.leadDays;
      var avail = numOrNull(s.qty_available);
      var band = avail === null ? null : avail <= rp ? "red" : avail <= rp + BANDS.inventory.watchDays * rate ? "amber" : "green";
      items.push({
        code: x.item_code, name: titles[x.shopify_column] || s.item_desc, avail: avail,
        expected: numOrNull(s.qty_expected), expectedDate: s.expected_date, poRef: s.po_ref,
        rate: rate, rp: rp, cover: rate > 0 && avail !== null ? avail / rate : null, band: band
      });
    });

    items.forEach(function (i) { if (i.band) counts[i.band] += 1; });
    return {
      items: items.sort(function (p, q) { return (p.cover === null ? Infinity : p.cover) - (q.cover === null ? Infinity : q.cover); }),
      counts: counts, problems: problems, historyDays: historyDays, historyFrom: first, historyTo: last,
      snapshotDate: parseDay(latestTs), firstSnapshot: parseDay(firstTs),
      band: counts.red ? "red" : counts.amber ? "amber" : items.length ? "green" : null
    };
  }

  // ---------- Marketing (d10_08 + d10_02 + dashboard_profit_after_ads_products) ----------

  // ---------- Cash (dashboard_cash_in_bank + d10_09) ----------
  var OUTFLOW_WINDOW_DAYS = 56;   // next 8 weeks from today
  function cashData(results, today) {
    var c = tableRows(results, "dashboard_cash_in_bank"), inv = tableRows(results, "d10_09_bidworks_invoices");
    var out = { cashError: c.error || null, invError: inv.error || null };
    if (!c.error) {
      var row = c.rows[0];
      out.cash = { value: numOrNull(row.value), status: row.status, asOf: row.as_of, note: row.note };
    }
    var start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var end = new Date(start); end.setDate(end.getDate() + OUTFLOW_WINDOW_DAYS);
    out.windowStart = start; out.windowEnd = end;
    if (!inv.error) {
      var rows = inv.rows.map(function (r) { return { date: parseDay(r["Date issued"]), amount: numOrNull(r.Amount), paid: r.Paid, id: r["Invoice #"] }; })
        .filter(function (r) { return r.date; }).sort(function (p, q) { return p.date - q.date; });
      var latest = rows[rows.length - 1];
      var invoiced = {};
      rows.forEach(function (r) { invoiced[r.date.getFullYear() + "-" + r.date.getMonth()] = r; });
      var projected = [];
      if (latest && latest.amount !== null) {
        var dom = latest.date.getDate();
        for (var k = 1; k < 600; k++) {
          var y = latest.date.getFullYear(), m = latest.date.getMonth() + k;
          var lastDay = new Date(y, m + 1, 0).getDate();
          var d = new Date(y, m, Math.min(dom, lastDay));
          if (d > end) break;
          if (d < start) continue;
          if (invoiced[d.getFullYear() + "-" + d.getMonth()]) continue;   // that month already has a real invoice
          projected.push({ date: d, amount: latest.amount });
        }
      }
      out.latestInvoice = latest; out.projected = projected;
      out.projectedTotal = projected.reduce(function (s, p) { return s + p.amount; }, 0);
      out.invoiceYears = rows.map(function (r) { return r.date.getFullYear(); }).filter(function (v, i, arr) { return arr.indexOf(v) === i; });
    }

  }

  function monthSeries(rev, year, key) {

  // ---------- Details: Revenue ----------

      html += '<div class="chart-card">' + notAvailable(mkt.error) + "</div>";
    } else {
      var ytdPct = mkt.ytdSpend !== null && mkt.ytdRevenue ? mkt.ytdSpend / mkt.ytdRevenue : null;
      var fyPct = mkt.fySpendPrev !== null && mkt.fyRevenuePrev ? mkt.fySpendPrev / mkt.fyRevenuePrev : null;
      var ytdRange = mkt.ytdMonths ? "Jan–" + shortMonth(mkt.latestYear + "-" + ("0" + mkt.ytdMonths).slice(-2)) : "";
      html += '<h3 class="group-head" style="margin-top:0;">' + esc(mkt.latestYear) + " Year to Date</h3>" +
        '<div class="row r2">' +
          '<div class="chart-card light"><div class="lbl">Ad Spend, YTD</div><div class="val" style="font-size:22px;">' + (mkt.ytdSpend !== null ? money(mkt.ytdSpend) : "—") + " " + bandPill("adSpend", adSpendBand(ytdPct)) + "</div>" +
            '<div class="det">' + (ytdPct !== null ? (ytdPct * 100).toFixed(1) + "% of " + money2(mkt.ytdRevenue) + " revenue (Amazon + Shopify), " + esc(ytdRange) : "% of revenue not available") + "</div>" +
            openNote(rev && !rev.error ? rev.ytdOpen : []) + calcLine() + "</div>" +
          '<div class="chart-card"><div class="lbl">By agency</div>' +
            '<div style="display:flex;gap:18px;flex-wrap:wrap;">' +
              '<div style="flex:1;"><div class="det">BidWorks</div><div class="val" style="font-size:18px;">' + (mkt.ytdSpend !== null ? money(mkt.ytdSpend) : "—") + "</div></div>" +
              '<div style="flex:1;"><div class="det">Handle Social</div><div class="val unknown" style="font-size:16px;">No source file</div></div></div>' +
            '<div class="det" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);">Q1 ' + esc(mkt.prevYear) + " vs. Q1 " + esc(mkt.latestYear) + ": BidWorks " +
              (mkt.q1Spend !== null && mkt.q1SpendPrev !== null ? (mkt.q1Spend === mkt.q1SpendPrev ? money(mkt.q1Spend) + " both years (flat)" : money(mkt.q1SpendPrev) + " → " + money(mkt.q1Spend)) : "not available") +
              " · Handle Social not comparable, no data either year.</div></div>" +
        "</div>" +
        '<h3 class="group-head">FY' + esc(mkt.prevYear) + "</h3>" +
        '<div class="row r2">' +
          '<div class="chart-card light"><div class="lbl">Ad Spend, Full Year</div><div class="val" style="font-size:22px;">' + (mkt.fySpendPrev !== null ? money(mkt.fySpendPrev) : "—") + " " + bandPill("adSpend", adSpendBand(fyPct)) + "</div>" +
            '<div class="det">' + (fyPct !== null ? (fyPct * 100).toFixed(1) + "% of " + money2(mkt.fyRevenuePrev) + " total revenue (Amazon + Shopify + Kickstarter)" : "% of revenue not available") + "</div>" + calcLine() + "</div>" +
          '<div class="chart-card"><div class="lbl">Net profit after ads</div><div class="val" style="font-size:22px;">' + (mkt.profitTotal !== null && mkt.profitTotal !== undefined ? money(mkt.profitTotal) : "—") + "</div>" +
            '<div class="det">' + (mkt.products ? mkt.products.filter(function (p) { return p.v > 0; }).length + " profitable · " + mkt.products.filter(function (p) { return p.v < 0; }).length + " losing money · FY2025 annual — no monthly breakdown exists" : esc(mkt.profitError || "")) + "</div></div>" +
        "</div>";
      html += '<h3 class="group-head">Agencies</h3><div class="row r2">' +
        '<div class="chan-card"><div class="chan-top"><div class="chan-badge" style="background:#2563EB;">' + AGENCY_ICONS.bidworks + "</div>" +
          '<div><div class="chan-name">BidWorks</div><div class="chan-val">' + (mkt.ytdSpend !== null ? money(mkt.ytdSpend) : "—") + "</div>" +
          '<div class="chan-cap">YTD ' + esc(mkt.latestYear) + (mkt.fySpendPrev !== null ? " · " + money(mkt.fySpendPrev) + " FY" + esc(mkt.prevYear) : "") + "</div></div></div></div>" +
        '<div class="chan-card"><div class="chan-top"><div class="chan-badge" style="background:#0D9488;">' + AGENCY_ICONS.handle + "</div>" +
          '<div><div class="chan-name">Handle Social</div><div class="chan-val unknown">No Data</div><div class="chan-cap">No spend file</div></div></div></div>' +
        "</div>";
    }
    html += '<h3 class="group-head">Profit after ads, by product</h3><div class="chart-card">';
    if (mkt.profitError) {
      html += notAvailable(mkt.profitError);
    } else {
      var items = mkt.products.slice().sort(function (p, q) { return p.v - q.v; });
      var maxP = Math.max.apply(null, items.map(function (p) { return Math.abs(p.v); })) || 1;
      html += '<div class="det" style="margin-bottom:10px;">FY2025 annual — no monthly breakdown exists · sorted lowest first</div>' +
        items.map(function (p) {
          var c = p.v >= 0 ? "#10B981" : "#E11D48";
          return '<div class="profit-row"><div>' + esc(p.name) + '</div><div class="track"' + tipAttr([p.name, money(p.v) + " net after ads, FY2025"]) + '><div class="fill2" style="width:' +
            (Math.abs(p.v) / maxP * 100).toFixed(1) + "%;background:" + c + '"></div></div><div class="pv" style="color:' + c + '">' + money(p.v) + "</div></div>";
        }).join("");
    }
    return html + "</div>";
  }

  // ---------- Details: Cash ----------
  function renderDetailsCash(cash, inv) {
    var restock = !inv.error ? inv.items.filter(function (i) { return i.expected > 0; }) : [];
    var lines = (cash.projected || []).map(function (p) {
      return "<tr><td>BidWorks retainer — " + esc(MONTHS_SHORT[p.date.getMonth()]) + "</td><td>~" + esc(dayLabel(p.date)) + ' (projected, not yet invoiced)</td><td class="num">' + money(p.amount) +
        "</td><td>Pattern from D10-09 (latest invoice " + esc(dayLabel(cash.latestInvoice.date)) + ")</td></tr>";
    }).join("") +
      restock.map(function (i) {
        return "<tr><td>Inventory restock — " + esc(i.name) + "</td><td>" + (i.expectedDate ? "Due " + esc(dayLabel(parseDay(i.expectedDate))) : "Unknown") + '</td><td class="num unknown">Unknown — not in our files</td>' +
          "<td>D10-07: " + num(i.expected, 0) + " units" + (i.poRef ? ", " + esc(i.poRef) : "") + " — no dollar value in our files</td></tr>";
      }).join("") +
      '<tr><td>3PL monthly invoice</td><td class="unknown">Unknown</td><td class="num unknown">Unknown</td><td>Not in our files</td></tr>' +
      '<tr><td>Handle Social retainer</td><td class="unknown">Unknown</td><td class="num unknown">Unknown</td><td>No source file</td></tr>' +
      '<tr><td>Payroll</td><td class="unknown">Unknown</td><td class="num unknown">Unknown</td><td>Not in our files</td></tr>';
    var cashHas = cash.cash && cash.cash.value !== null && cash.cash.status !== "no_data";
    return sectionOwnerHead("cash") +
      '<div class="row r2">' +
        '<div class="chart-card"><div class="lbl">Available Cash' + STAR + "</div>" +
          (cash.cashError ? notAvailable(cash.cashError) : '<div class="val ' + (cashHas ? "" : "unknown") + '" style="font-size:20px;">' + (cashHas ? money(cash.cash.value) : "Unknown") + "</div>" +
          '<div class="det">' + (cashHas ? "As of " + esc(cash.cash.asOf || "—") : "No bank feed or confirmed balance exists.") + "</div>") + "</div>" +
        '<div class="chart-card"><div class="lbl">Known Upcoming Outflows, ' + esc(dayLabel(cash.windowStart)) + " – " + esc(dayLabel(cash.windowEnd)) + "</div>" +
          (cash.invError ? notAvailable(cash.invError) : '<div class="val" style="font-size:20px;">' + money(cash.projectedTotal) + "</div>" +
          '<div class="det">' + cash.projected.length + " projected BidWorks invoice" + (cash.projected.length === 1 ? "" : "s") +
            (cash.projected.length ? " (" + cash.projected.map(function (p) { return MONTHS_SHORT[p.date.getMonth()]; }).join(", ") + ")" : "") + " · rest unknown</div>") + "</div>" +
      "</div>" +
      '<div class="chart-card"><h2 class="section">Upcoming outflows</h2><div class="table-wrap"><table class="dtbl">' +
        '<tr><th>Item</th><th>Due</th><th class="num">Amount</th><th>Basis</th></tr>' + lines + "</table></div>" +
        '<div class="flag-box"><b>Why this differs from the peer dashboard\'s $54,600 (their reported figure, not from our files):</b> ' +
          "their total appears to include an already-paid March BidWorks invoice (likely counted twice), plus a Handle Social retainer and a supplier PO balance we have no source for. " +
          "Our " + money(cash.projectedTotal || 0) + " counts only invoices that can be projected from D10-09.</div></div>";
  }

  function renderDetails(rev, inv, mkt, cash) {
    var subs = [["d-rev", "Revenue"], ["d-inv", "Inventory"], ["d-mkt", "Marketing &amp; Ads"], ["d-cash", "Cash"]];
    return legendBox() +
      '<div class="subnav" role="tablist" aria-label="Details sections">' + subs.map(function (s, i) {
        return '<button class="sub-btn' + (i ? "" : " active") + '" role="tab" id="sub-' + s[0] + '" aria-controls="' + s[0] + '" aria-selected="' + (i ? "false" : "true") + '"' + (i ? ' tabindex="-1"' : "") + ' data-sub="' + s[0] + '">' + s[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="subpanel active" id="d-rev" role="tabpanel" aria-labelledby="sub-d-rev">' + renderDetailsRevenue(rev) + "</div>" +
      '<div class="subpanel" id="d-inv" role="tabpanel" aria-labelledby="sub-d-inv">' + renderDetailsInventory(inv) + "</div>" +
      '<div class="subpanel" id="d-mkt" role="tabpanel" aria-labelledby="sub-d-mkt">' + renderDetailsMarketing(mkt, rev) + "</div>" +
      '<div class="subpanel" id="d-cash" role="tabpanel" aria-labelledby="sub-d-cash">' + renderDetailsCash(cash, inv) + "</div>";
  }

  // ---------- Data Notes ----------
  function renderNotes(inv, cash) {
    var gp = !inv.error ? inv.items.filter(function (i) { return i.code === GRILL_PRO_ITEM; })[0] : null;
    var st = function (cls, text) { return '<span class="matrix-status ' + cls + '">' + esc(text) + "</span>"; };
    var row = function (kpi, point, rule, status) { return "<tr><td>" + kpi + "</td><td>" + point + "</td><td>" + rule + "</td><td>" + status + "</td></tr>"; };
    var grp = function (name) { return '<tr class="grpname"><td colspan="4">' + name + "</td></tr>"; };
    return '<h2 class="section">Band wording by KPI</h2><div class="table-wrap"><table class="dtbl">' +
        '<tr><th>KPI</th><th style="color:var(--red)">Red</th><th style="color:#92400E">Amber</th><th style="color:#047857">Green</th></tr>' +
        "<tr><td>Revenue</td><td>Below target — flag to Lena (more than 10% below the same month last year)</td><td>Watch — within 10% of last year</td><td>On track (at or above the same month last year)</td></tr>" +
        "<tr><td>Inventory</td><td>PO Now (on hand at or below the reorder point)</td><td>Watch — Next PO Cycle (within 14 days' sell-through above the reorder point)</td><td>Healthy Stock</td></tr>" +
        "<tr><td>Marketing &amp; Ads (ad spend %)</td><td>Act now — review spend (&gt;15%, proposed)</td><td>Watch (10–15%, proposed)</td><td>On track (≤10%, proposed)</td></tr>" +
        "<tr><td>Marketing &amp; Ads (profit after ads)</td><td>Losing money — review ad spend</td><td>— (no amber tier)</td><td>Profitable</td></tr>" +
      "</table></div>" +
      '<div class="det" style="margin:10px 0 6px;">Marketing\'s ad-spend-% thresholds (15%/10%) are proposed by us, pending sign-off — not confirmed.</div>' +
      '<div class="det" style="margin:0 0 6px;">FY ad spend ratio: This ratio uses total revenue including Kickstarter, unlike the Amazon+Shopify-only basis used for revenue trend metrics elsewhere, because it measures company-wide spend efficiency, not channel trend.</div>' +
      '<div class="det" style="margin:0 0 24px;">Revenue "Data as of": only the saved revenue update query (supabase/revenue_update_query.sql) moves this time. Edits typed directly into the Supabase Table Editor change the figures but not "Data as of".</div>' +
      '<h2 class="section">Decision Matrix</h2><div class="table-wrap"><table class="dtbl">' +
        "<tr><th>KPI</th><th>Decision point</th><th>Current rule</th><th>Status</th></tr>" +
        grp("Revenue") +
        row("Revenue", "Kickstarter in/out (trend metrics)", "Excluded", st("decided", "Decided")) +
        row("Revenue", "Comparison period", "Q1 v. Q1, plus a separate YTD-vs-full-year pace figure", st("decided", "Decided")) +
        grp("Inventory") +
        row("Inventory", "Reorder lead time", "8 weeks (6wk factory + 2wk buffer)", st("confirmed", "Confirmed — Stacey, 13 Oct 2026")) +
        row("Inventory", "Peak/low season split", "Not used — no data exists", st("pending", "Pending — our PO Now count (" + (inv.error ? "—" : inv.counts.red) + ") differs from a peer pod's")) +
        row("Inventory", "Grill Pro cover",
          "Grill Pro: " + (gp && gp.cover !== null ? "~" + num(gp.cover, 0) + " days of cover (recalculated)" : "days of cover not available") +
          " vs. Lena's account of ~1 month — roughly consistent, worth a quick confirmation with Marco, not an open conflict.", st("pending", "Quick confirmation — Marco")) +
        grp("Marketing &amp; Ads") +
        row("Marketing", "Main KPI metric", "Ad spend $, latest closed quarter (Q1), matching Revenue's cadence", st("decided", "Decided")) +
        row("Marketing", "Band thresholds for ad-spend %", "Proposed: Green ≤10%, Amber 10–15%, Red &gt;15%", st("pending", "Pending — needs sign-off")) +
        row("Marketing", "Handle Social spend", "No source file — not estimated", st("pending", "Pending — no source exists")) +
        grp("Cash") +
        row("Cash", "Discrepancy vs. a peer pod's total", "Our " + (cash.invError ? "—" : money(cash.projectedTotal)) + " excludes an apparent double-count and two lines we have no source for",
          st("pending", "Pending — worth raising with them")) +
      "</table></div>";
  }

  // ---------- Rows read from Supabase ----------
  var lastLoaded = null;
  function renderLoadReport(results) {
    var total = 0, read = 0;
    var body = TABLE_GROUPS.map(function (g) {
      return '<tr class="grpname"><td colspan="3">' + esc(g.kpi) + "</td></tr>" + g.tables.map(function (t) {
        var r = results[t[0]] || { ok: false, error: "Not read" };
        if (r.ok) { total += r.rows.length; read += 1; }
        return '<tr><td style="overflow-wrap:anywhere">' + esc(t[0]) + '</td><td class="num">' + (r.ok ? num(r.rows.length, 0) : "—") + "</td><td>" +
          (r.ok ? '<span style="color:var(--green);font-weight:700;">✓</span> ' + esc(t[1]) : '<span style="color:var(--red);font-weight:700;">Failed:</span> ' + esc(r.error)) + "</td></tr>";
      }).join("");
    }).join("");
    var stamp = lastLoaded ? lastLoaded.toLocaleString("en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
    return '<h2 class="section">Rows read from Supabase, by KPI</h2>' +
      '<div class="det" style="margin-bottom:12px;">Last refreshed: <b>' + esc(stamp) + "</b> · build mode: manual (no scheduled job yet)</div>" +
      '<div class="table-wrap"><table class="dtbl" id="load-report"><tr><th>Table</th><th class="num">Rows</th><th>Feeds</th></tr>' + body + "</table></div>" +
      '<div class="det" style="margin-top:12px;"><b>' + num(total, 0) + " rows across " + read + " tables</b>" +
        (read < ALL_TABLES.length ? " · " + (ALL_TABLES.length - read) + " of " + ALL_TABLES.length + " tables failed" : "") + "</div>";
  }

  // ---------- Tooltip ----------
  var tip = document.getElementById("tip");
  function showTip(el, x, y) {
    tip.textContent = el.getAttribute("data-tip");
    tip.style.display = "block";
    var r = tip.getBoundingClientRect();
    var left = Math.min(Math.max(8, x + 12), window.innerWidth - r.width - 8);
    var top = y - r.height - 12 < 8 ? y + 16 : y - r.height - 12;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  app.addEventListener("mousemove", function (e) {
    var el = e.target.closest("[data-tip]");
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  app.addEventListener("mouseleave", hideTip);
  app.addEventListener("focusin", function (e) {
    var el = e.target.closest("[data-tip]");
    if (!el) return;
    var b = el.getBoundingClientRect();
    showTip(el, b.left + b.width / 2, b.top);
  });
  app.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  // ---------- Footer ----------
  // The data carries no approval field, so this status is set here by hand.
  // Change it only once the coach has actually signed off on the schema.
  var SCHEMA_STATUS = "schema pending coach sign-off";
  var KPI_COUNT = 4;   // Revenue, Inventory, Marketing & Ads, Cash
  function renderFooter(loadedAt) {
    var stamp = loadedAt.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
    var footer = document.getElementById("run-footer");
    footer.innerHTML = KPI_COUNT + " metrics · " + '<span class="pending">' + esc(SCHEMA_STATUS) + "</span> · " +
      'last run <time datetime="' + loadedAt.toISOString() + '" title="When this page last loaded its data from Supabase">' + esc(stamp) + "</time>";
    footer.hidden = false;
  }

  // ---------- Tabs (top level and Details sub-tabs) ----------
  function wireTabs(buttons, panelOf) {
    function show(btn, focus) {
      buttons.forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        panelOf(b).classList.toggle("active", on);
      });
      hideTip();
      if (focus) btn.focus();
    }
    buttons.forEach(function (btn, i) {
      btn.addEventListener("click", function () { show(btn); });
      btn.addEventListener("keydown", function (e) {
        var k = e.key, n = buttons.length, j = null;
        if (k === "ArrowDown" || k === "ArrowRight") j = (i + 1) % n;
        else if (k === "ArrowUp" || k === "ArrowLeft") j = (i - 1 + n) % n;
        else if (k === "Home") j = 0;
        else if (k === "End") j = n - 1;
        if (j !== null) { e.preventDefault(); show(buttons[j], true); }
      });
    });
  }
  wireTabs(Array.prototype.slice.call(document.querySelectorAll(".tab-btn")), function (b) { return document.getElementById(b.dataset.tab); });

  function setPanel(id, html) { document.getElementById(id).innerHTML = html; }

  function render(results) {
    renderFooter(lastLoaded);
    var rev = revenueData(results);
    var inv = inventoryData(results);
    var mkt = marketingData(results, rev);
    var cash = cashData(results, lastLoaded);
    setPanel("summary", renderSummary(rev, inv, mkt, cash));
    setPanel("details", renderDetails(rev, inv, mkt, cash));
    setPanel("notes", renderNotes(inv, cash));
    wireTabs(Array.prototype.slice.call(document.querySelectorAll(".sub-btn")), function (b) { return document.getElementById(b.dataset.sub); });
  }

  // ---------- Reading from Supabase ----------
  function errorText(err) {
    if (!err) return "Unknown error";
    var parts = [err.message || String(err)];
    if (err.code) parts.push("code " + err.code);
    if (err.details) parts.push(err.details);
    if (err.hint) parts.push(err.hint);
    return parts.join(" · ");
  }

  // Reads every row of one table, PAGE_SIZE rows per request, until the table's own row count is reached.
  function readTable(client, name) {
    var rows = [], total = null;
    function page(from) {
      return client.from(name).select("*", { count: "exact" })
        .order("source_row", { ascending: true })
        .range(from, from + PAGE_SIZE - 1)
        .then(function (res) {
          if (res.error) throw res.error;
          var data = res.data || [];
          if (typeof res.count === "number") total = res.count;
          rows = rows.concat(data);
          if (total === null) {
            if (data.length < PAGE_SIZE) return;
          } else if (rows.length >= total) {
            return;
          } else if (data.length === 0) {
            throw new Error("Reading stopped at " + rows.length + " of " + total + " rows");
          }
          // Advance by what actually came back, in case the server caps pages below PAGE_SIZE.
          return page(from + data.length);
        });
    }
    return page(0).then(function () {
      if (total !== null && rows.length !== total) {
        throw new Error("Read " + rows.length + " rows but the table reports " + total);
      }
      return { name: name, ok: true, rows: rows };
    }).catch(function (err) {
      return { name: name, ok: false, error: errorText(err) };
    });
  }

  function showLoadError(title, lines) {
    var card = '<section class="card" id="load-error">' +
        '<div class="card-head"><h2>' + esc(title) + "</h2>" + pill("red", "Error") + "</div>" +
        lines.map(function (l) { return '<p class="note">' + l + "</p>"; }).join("") +
      "</section>";
    ["summary", "details", "notes", "rows"].forEach(function (id) { setPanel(id, card); });
  }

  function looksLikeSecretKey(key) {
    if (/^sb_secret_/.test(key)) return true;
    var parts = key.split(".");
    if (parts.length !== 3) return false;
    try { return JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role"; }
    catch (e) { return false; }
  }

  function start() {
    var cfg = window.TANNERHILL_CONFIG || {};
    var url = cfg.supabaseUrl || "", key = cfg.supabasePublishableKey || "";
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      return showLoadError("Data not loaded", ["The Supabase library did not load from cdn.jsdelivr.net."]);
    }
    if (!url || !key || /YOUR-PROJECT-REF|REPLACE_ME/.test(url + key)) {
      return showLoadError("Data not loaded", ["<code>config.js</code> still has placeholder values. " +
        "Set the Project URL and the publishable key from Supabase → Project Settings → API Keys."]);
    }
    if (looksLikeSecretKey(key)) {
      return showLoadError("Data not loaded", ["<code>config.js</code> contains a secret key. " +
        "Remove it now and rotate it in Supabase: this page is public, so only the publishable key may go here."]);
    }
    var client = window.supabase.createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
    Promise.all(ALL_TABLES.map(function (n) { return readTable(client, n); })).then(function (list) {
      lastLoaded = new Date();
      var results = {};
      list.forEach(function (r) { results[r.name] = r; });
      // Each KPI column reports its own missing tables; a failed table never shows as zero.
      try { render(results); }
      catch (e) { showLoadError("Dashboard not shown", ["Drawing failed: " + esc(e.message || e)]); }
      setPanel("rows", renderLoadReport(results));
    }).catch(function (e) {
      showLoadError("Data not loaded", [esc(e.message || e)]);
    });
  }

  start();
})();
</script>
</body>
</html>
